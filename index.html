<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaCandela - Artesania y regalos Córdoba</title>
  <style>
    :root {
      --fondo: #f1f4f1;
      --texto: #1f3a34;
      --suave: #5b706a;
      --llama: #e8a317;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #14231f;
        --texto: #eef2ee;
        --suave: #a9bab4;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--fondo);
      color: var(--texto);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main { max-width: 34rem; }
    .llama {
      width: 18px;
      height: 30px;
      margin: 0 auto 18px;
      background: var(--llama);
      border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
      animation: parpadeo 2.4s ease-in-out infinite;
    }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
    p { margin: 0; font-size: 1.1rem; line-height: 1.6; color: var(--suave); }
    @keyframes parpadeo {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92, 1.06); opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      .llama { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="llama" aria-hidden="true"></div>
    <h1>LaCandela</h1>
    <p>Artesania y regalos Córdoba</p>
    <p>Estamos preparando la tienda online. Muy pronto podrás ver aquí nuestros productos.</p>
  </main>
</body>
</html>
